<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora - Nations Guesser</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="container">
        <div class="intro A">
            <h1>Nexora</h1>
            <form id="form">
                <div id="limit">
                    <label>Enter the number of nations to generate!</label>
                    <input type="number" min="0" max="5" placeholder=" From 1 to 5">
                </div>

                <div id="difficulty">
                    <label>Select the difficulty!</label>
                    <div id="buttons">
                    <button type="button" class="btn diff-btn">Easy</button>
                    <button type="button" class="btn diff-btn">Medium</button>
                    <button type="button" class="btn diff-btn">Hard</button>
                    <button type="button" class="btn diff-btn">Extreme</button>
                    </div>
                </div>

                <div id="submit">
                    <button class="btn submit-btn" type="submit">Generate</button>
                </div>

            </form>
        </div>
    </div>

</body>
</html>
