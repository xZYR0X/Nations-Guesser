<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora - Nations Guesser</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="container">
        <div class="intro A">

            <div class="hallowen-spookystuffs">
                <img src="pumpkinn.png" alt="aa">
            </div>

            <div class="hallowen-spookystuffss">
                <img src="c.png" alt="aa">
            </div>

            <img src="b.png" class="displaynone" alt="a">

            <h1>Nexora</h1>
            <form id="form" action="save">
                <div id="limit">
                    <label>Enter the number of nations to generate!</label>
                    <input type="number" min="0" max="5" placeholder=" From 1 to 5">
                </div>

                <div id="difficulty">
                    <label>Select the difficulty!</label>
                    <div id="buttons">
                    <button type="button" class="btn diff-btn active" data-diff="easy" >Easy</button>
                    <button type="button" class="btn diff-btn" data-diff="medium" >Medium</button>
                    <button type="button" class="btn diff-btn" data-diff="hard" >Hard</button>
                    <button type="button" class="btn diff-btn" data-diff="extreme">Extreme</button>
                    </div>
                </div>

                <div id="submit">
                    <button class="btn submit-btn" type="submit" onclick="hallowenstuff()">Generate</button>
                </div>
                 <img src="b.png" class="displaynone spooky" alt="a">
            </form>
        </div>
    </div>

    <div class="containerr displaynone">
        <div class="intro aa">
            <h1>Pick a Box!</h1>

            <div class="boxes">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
                <div class="box">5</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
